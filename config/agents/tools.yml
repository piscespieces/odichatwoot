######  Captain Agent Tools Configuration #######
# id: Tool identifier used to resolve the class (Captain::Tools::{PascalCase(id)}Tool)
# title: Human-readable tool name for frontend display
# description: Brief description of what the tool does
# icon: Icon name for frontend display (frontend icon system)
#######################################################

- id: add_contact_note
  title: 'Add Contact Note'
  description: 'Add a note to a contact profile'
  icon: 'note-add'

- id: add_private_note
  title: 'Add Private Note'
  description: 'Add a private note to a conversation (internal only)'
  icon: 'eye-off'

- id: update_priority
  title: 'Update Priority'
  description: 'Update conversation priority level'
  icon: 'exclamation-triangle'

- id: add_label_to_conversation
  title: 'Add Label to Conversation'
  description: 'Add a label to a conversation'
  icon: 'tag'

- id: faq_lookup
  title: 'FAQ Lookup'
  description: 'Search FAQ responses using semantic similarity'
  icon: 'search'

- id: resolve_conversation
  title: 'Resolve Conversation'
  description: 'Resolve a conversation when the issue has been addressed'
  icon: 'checkmark'

- id: handoff
  title: 'Handoff to Human'
  description: 'Hand off the conversation to a human agent'
  icon: 'user-switch'

- id: create_calendar_event
  title: 'Create Calendar Event'
  description: 'Create a new event in Google Calendar'
  icon: 'calendar-plus'

- id: get_current_calendar_time
  title: 'Get Current Calendar Time'
  description: 'Get the current Google Calendar time in ISO 8601 format'
  icon: 'clock'

- id: get_free_busy_calendar
  title: 'Get Free/Busy Calendar'
  description: "Query Google's free/busy endpoint for busy time blocks"
  icon: 'calendar-search'

- id: get_current_cal_com_time
  title: 'Get Current Cal.com Time'
  description: 'Get the current time using Cal.com account timezone'
  icon: 'clock'

- id: get_cal_com_available_slot
  title: 'Get Cal.com Available Slots'
  description: 'Get available time slots from Cal.com for scheduling appointments'
  icon: 'calendar-search'

- id: create_cal_com_booking
  title: 'Create Cal.com Booking'
  description: 'Create a booking/appointment in Cal.com'
  icon: 'calendar-plus'
